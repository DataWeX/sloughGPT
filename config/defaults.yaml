# Default config — overridden by env vars and profile-specific files.
# Nested keys use YAML nesting. Env override: SLO_MODEL__NAME=gpt2

model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  device: "auto"
  max_length: 1024
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  max_new_tokens: 200
  use_slonet: false
  autoload: true

server:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  reload: false
  request_timeout: 60.0
  inference_pool_size: 2

features:
  auto_workflow: true
  health_monitor: true
  health_interval: 300
  watchdog: true
  web: false

auth:
  jwt_secret: "dev-secret-change-in-production"
  jwt_algorithm: "HS256"
  jwt_expiration_hours: 24
  api_keys_enabled: false

storage:
  data_dir: "data"
  datasets_dir: "datasets"
  models_dir: "models"
  checkpoint_dir: "models/auto-training"
