{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sloughgpt.fullname" . }}-api-network-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sloughgpt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sloughgpt.api.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - podSelector:
        matchLabels:
          {{- include "sloughgpt.web.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sloughgpt.fullname" . }}-web-network-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sloughgpt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sloughgpt.web.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "sloughgpt.api.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
{{- end }}
