{{- if .Values.rbac.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sloughgpt.fullname" . }}-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sloughgpt.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sloughgpt.fullname" . }}-role
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sloughgpt.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets", "services", "pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sloughgpt.fullname" . }}-rolebinding
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sloughgpt.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "sloughgpt.fullname" . }}-sa
  namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: {{ include "sloughgpt.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sloughgpt.fullname" . }}-clusterrole
  labels:
    {{- include "sloughgpt.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes", "persistentvolumes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sloughgpt.fullname" . }}-clusterrolebinding
  labels:
    {{- include "sloughgpt.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "sloughgpt.fullname" . }}-sa
  namespace: {{ .Values.global.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "sloughgpt.fullname" . }}-clusterrole
  apiGroup: rbac.authorization.k8s.io
{{- end }}
