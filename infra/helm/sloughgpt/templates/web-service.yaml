apiVersion: v1
kind: Service
metadata:
  name: {{ include "sloughgpt.fullname" . }}-web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sloughgpt.labels" . | nindent 4 }}
    {{- include "sloughgpt.web.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
  - port: {{ .Values.web.service.port }}
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    {{- include "sloughgpt.web.selectorLabels" . | nindent 4 }}
