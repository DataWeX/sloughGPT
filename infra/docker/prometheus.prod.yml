# Prometheus config for SloughGPT production stack

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "sloughgpt-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics/prometheus
    scrape_interval: 5s

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
    metrics_path: /health
    scrape_interval: 15s
