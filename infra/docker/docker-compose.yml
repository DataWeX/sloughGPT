services:
  # ─── API Server (CPU) ─────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: sloughgpt-api
    image: sloughgpt/api:latest
    ports:
      - "8000:8000"
    environment:
      - SLO_ENV=production
      - SLO_LOG_LEVEL=INFO
      - SLO_HOST=0.0.0.0
      - SLO_PORT=8000
      - SLO_AUTO_WORKFLOW=${SLO_AUTO_WORKFLOW:-false}
    volumes:
      - api-models:/app/models
      - api-data:/app/data
      - api-datasets:/app/datasets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
    networks:
      - sloughgpt-net

  # ─── Web UI (Vite static SPA — Phase 6 cutover) ───────────────────
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.vite
      args:
        API_BASE: http://api:8000
    container_name: sloughgpt-web
    image: sloughgpt/web:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - sloughgpt-net
    depends_on:
      api:
        condition: service_healthy

  # ─── CLI ──────────────────────────────────────────────────────────
  cli:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.cli
    container_name: sloughgpt-cli
    image: sloughgpt/cli:latest
    environment:
      - SLO_API_URL=http://api:8000
    volumes:
      - cli-state:/root/.config/sloughgpt
    networks:
      - sloughgpt-net
    depends_on:
      api:
        condition: service_healthy
    stdin_open: true
    tty: true

  # ─── GPU API (NVIDIA CUDA) ────────────────────────────────────────
  api-gpu:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gpu
    container_name: sloughgpt-api-gpu
    image: sloughgpt/api:gpu
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - SLO_ENV=production
      - SLO_LOG_LEVEL=INFO
    volumes:
      - api-models:/app/models
      - api-data:/app/data
      - api-datasets:/app/datasets
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
    networks:
      - sloughgpt-net

  # ─── Dev (hot reload) ─────────────────────────────────────────────
  dev:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: sloughgpt-dev
    image: sloughgpt/dev:latest
    ports:
      - "8000:8000"
    environment:
      - SLO_ENV=development
      - SLO_LOG_LEVEL=DEBUG
    volumes:
      - ../../:/app
      - /app/__pycache__
    command: sh -c "cd /app/apps/api/server && uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    profiles:
      - dev
    networks:
      - sloughgpt-net

volumes:
  api-models:
  api-data:
  api-datasets:
  cli-state:

networks:
  sloughgpt-net:
    name: sloughgpt-network
    driver: bridge
