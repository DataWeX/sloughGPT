version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: sloughgpt-api
    ports:
      - "8000:8000"
    environment:
      - SLO_ENV=production
      - SLO_LOG_LEVEL=INFO
      - SLO_HOST=0.0.0.0
      - SLO_PORT=8000
      - SLO_AUTO_WORKFLOW=false
      - SLO_AUTH_REQUIRED=true
      - SLO_CORS_ORIGINS=https://your-domain.com
    volumes:
      - api-models:/app/models
      - api-data:/app/data
      - api-datasets:/app/datasets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
    networks:
      - sloughgpt-net

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: sloughgpt-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://your-domain.com
      - NODE_ENV=production
      - NEXTAUTH_URL=https://your-domain.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - sloughgpt-net
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-models:
  api-data:
  api-datasets:

networks:
  sloughgpt-net:
    name: sloughgpt-network
    driver: bridge
