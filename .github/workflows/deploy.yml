name: Deploy Website — Git Sync (Tailscale + Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/strui/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci --ignore-scripts

      - name: Build Vite static export
        working-directory: apps/web
        run: npm run build:vite

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist-vite/
          retention-days: 1

  deploy:
    name: Deploy (Tailscale + Cloudflare)
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: /tmp/dist-vite

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Setup deploy SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Sync build to server
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_HOST }}"
          USER="${{ secrets.DEPLOY_USER || 'root' }}"
          rsync -avz --delete \
            -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' \
            /tmp/dist-vite/ \
            "${USER}@${HOST}:/var/www/html/"

      - name: Post-deploy (reload + verify)
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_HOST }}"
          USER="${{ secrets.DEPLOY_USER || 'root' }}"
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" 'bash -s' < infra/scripts/deploy-web.sh

      - name: Purge Cloudflare cache
        if: ${{ vars.CF_ZONE_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          resp=$(curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ vars.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge":"everything"}') || true
          echo "Cloudflare purge: $resp"
