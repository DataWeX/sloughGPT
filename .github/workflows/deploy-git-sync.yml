name: Deploy Website (Git Sync)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/strui/**"
      - ".github/workflows/deploy-git-sync.yml"
  workflow_dispatch:

concurrency:
  group: deploy-git-sync
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install deps
        run: npm ci
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist-vite/
          retention-days: 1

  deploy:
    name: Deploy via Tailscale
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    if: ${{ secrets.TS_AUTHKEY != '' && secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: /tmp/dist

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa" /tmp/dist/ ${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }}:/var/www/html/

      - name: Post-deploy
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }} "systemctl reload nginx || true; systemctl reload caddy || true"
        if: always()

      - name: Purge Cloudflare
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CF_ZONE_ID != '' }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ vars.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
