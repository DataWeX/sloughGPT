name: Deploy Website (Git Sync)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/strui/**"
      - ".github/workflows/deploy-git-sync.yml"
  workflow_dispatch:

concurrency:
  group: deploy-git-sync
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist-vite/
          retention-days: 1

  deploy:
    name: Deploy via Tailscale
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    # `secrets` is NOT a legal context in ANY `if:`. GitHub's
    # context-availability table lists it for `jobs.<job_id>.env`,
    # `steps.env`, `steps.run`, `steps.with` … but NOT for
    # `jobs.<job_id>.if` nor `jobs.<job_id>.steps.if` — and actionlint
    # enforces exactly that table. The old job-level
    # `if: ${{ secrets.TS_AUTHKEY != '' && … }}` therefore made the whole
    # workflow invalid: 2 runs ever (2026-10-27), both failure at 0 s with
    # zero jobs and no log. That guard is gone — credentials are checked in
    # a step below — and the one remaining `secrets`-in-`if` (Purge
    # Cloudflare) is lifted into `env`, which `jobs.<job_id>.env` does allow.
    # Card 20261122_083741.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Ported from ci_cd.yml's "Verify deploy credentials" (db958b791) —
      # same pattern, one credential-check idiom in the repo, not two. A
      # missing secret FAILS the run with `::error::` instead of skipping
      # silently. The old guard checked TS_AUTHKEY, which this workflow
      # never reads; this checks the four secrets the steps below consume.
      - name: Verify deploy credentials
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$TS_OAUTH_CLIENT_ID" ] || missing="$missing TS_OAUTH_CLIENT_ID"
          [ -n "$TS_OAUTH_SECRET" ]    || missing="$missing TS_OAUTH_SECRET"
          [ -n "$DEPLOY_HOST" ]        || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_SSH_KEY" ]     || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::web deploy cannot run — missing secrets:$missing"
            exit 1
          fi
          echo "credentials present (host=$DEPLOY_HOST)"

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: /tmp/dist

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa" /tmp/dist/ ${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }}:/var/www/html/

      - name: Post-deploy
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }} "systemctl reload nginx || true; systemctl reload caddy || true"
        if: always()

      - name: Purge Cloudflare
        # Tested from the job-level `env` above: `secrets` is not an allowed
        # context in `steps.if` (context-availability table), `env` is.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && vars.CF_ZONE_ID != '' }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ vars.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
