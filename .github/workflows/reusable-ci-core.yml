# Shared lint + core pytest suite for CI and CI/CD workflows.
name: Reusable CI core

on:
  workflow_call:
    inputs:
      upload_test_artifact:
        description: Upload test results as artifact
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt
      - run: pip install ruff
      - name: Ruff syntax check
        run: ruff check packages/core-py/ apps/api/server/ --select E9,F63,F7,F82 --exclude '__pycache__'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers fastapi uvicorn pydantic httpx numpy scipy psutil peft python-multipart
          python -m pip install pytest pytest-cov pytest-asyncio pytest-xdist requests

      - name: Core-py tests
        run: |
          cd packages/core-py
          python -m pytest tests/ \
            --ignore=tests/test_hf_finetune.py \
            --ignore=tests/test_multimodal_generation.py \
            --ignore=tests/test_multimodal_v2.py \
            --ignore=tests/test_server_integration.py \
            --ignore=tests/test_process_isolation.py \
            --ignore=tests/test_hf_dpo.py \
            --ignore=tests/test_unified_pipeline_run.py \
            --ignore=tests/test_numpy_engine.py \
            --ignore=tests/test_safetensors_loader.py \
            --ignore=tests/test_executor_endpoints.py \
            --ignore=tests/test_shell_integration.py \
            --ignore=tests/test_morph_tokenizer.py \
            --ignore=tests/test_point_library.py \
            --ignore=tests/test_slonet_compute_sensitivity.py \
            --ignore=tests/test_slonet_provider.py \
            --ignore=tests/test_shell_repl.py \
            -q --tb=short

      - name: Server tests
        working-directory: apps/api/server
        run: python -m pytest tests/ -q --tb=short

      # DISABLED: ~100 pre-existing failures from success_response wrapper and dead imports
      # - name: Root tests
      #   run: |
      #     python -m pytest tests/ \
      #       --override-ini="testpaths=tests" \
      #       --override-ini="addopts=" \
      #       --ignore=tests/test_checkpoint_utils.py \
      #       --ignore=tests/test_knowledge_graph.py \
      #       --ignore=tests/test_lm_eval_char.py \
      #       --ignore=tests/test_rag.py \
      #       --ignore=tests/test_train_sloughgpt_generate_text.py \
      #       --ignore=tests/test_train_sloughgpt_resume.py \
      #       --ignore=tests/server/ \
      #       -q --tb=short

      - name: Upload test results
        if: ${{ inputs.upload_test_artifact && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/
