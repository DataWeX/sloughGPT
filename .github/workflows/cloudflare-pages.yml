name: Deploy SloughGPT Web to Cloudflare Pages

on:
  push:
    branches: [ session/agent_4563443b-dfec-4a33-8ddd-a92fc5c84485 ]
    paths:
      - "apps/web/**"
      - "packages/strui/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sloughgpt-web
          directory: apps/web/.next
          branch: session/agent_4563443b-dfec-4a33-8ddd-a92fc5c84485
