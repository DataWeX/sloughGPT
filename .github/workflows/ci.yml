name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/strui/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: packages/strui
      - name: Ensure @sloughgpt/strui symlink
        run: |
          if [ ! -L node_modules/@sloughgpt/strui ] && [ ! -d node_modules/@sloughgpt/strui ]; then
            mkdir -p node_modules/@sloughgpt
            ln -sfn ../../../../packages/strui node_modules/@sloughgpt/strui
          fi
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web

  frontend-lib-tests:
    name: Frontend lib tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/strui/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:lib
        working-directory: apps/web

  frontend-build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/strui/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci --omit=peer
        working-directory: packages/strui
      - name: Ensure @sloughgpt/strui symlink
        run: |
          if [ ! -L node_modules/@sloughgpt/strui ] && [ ! -d node_modules/@sloughgpt/strui ]; then
            mkdir -p node_modules/@sloughgpt
            ln -sfn ../../../../packages/strui node_modules/@sloughgpt/strui
          fi
        working-directory: apps/web
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Unit tests
        run: npx vitest run
        working-directory: apps/web
      - name: Vite production build
        run: npm run build:vite
        working-directory: apps/web
      - name: Assert dist-vite
        run: test -f dist-vite/index.html
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: dist-vite
          path: apps/web/dist-vite
          retention-days: 7

  frontend-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/strui/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci --omit=peer
        working-directory: packages/strui
      - name: Ensure @sloughgpt/strui symlink
        run: |
          if [ ! -L node_modules/@sloughgpt/strui ] && [ ! -d node_modules/@sloughgpt/strui ]; then
            mkdir -p node_modules/@sloughgpt
            ln -sfn ../../../../packages/strui node_modules/@sloughgpt/strui
          fi
        working-directory: apps/web
      - name: Cypress (Vite smoke + redirects)
        run: npm run e2e:vite
        working-directory: apps/web

  python-checks:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            apps/api/server/requirements.txt
            packages/mogdb/pyproject.toml
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install mogdb
        run: |
          pip install --upgrade pip
          pip install pytest
          # Root pytest.ini filterwarnings reference starlette; the mogdb job
          # otherwise aborts at collection when it is not installed.
          pip install starlette
          pip install -e packages/mogdb
      - name: Syntax check
        run: |
          python3 -m py_compile packages/mogdb/src/mogdb/collection.py
          python3 -m py_compile packages/mogdb/src/mogdb/database.py
      - name: Run mogdb tests
        run: python3 -m pytest packages/mogdb/tests/test_mogdb.py -q -o "addopts=" -o "filterwarnings="

  feature-tags:
    name: Feature Tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check feature tags
        run: |
          PYTHONPATH=packages/core-py python3 scripts/check_feature_tags.py --validate --check-deletions

  # Doc-vs-code parity. The Router Playbook used to be a prose checklist
  # ("grep -c _internal <router> = 0"), which is how the documented figures
  # drifted from the code without anyone noticing. This runs the executable
  # form: route tables, API.md counts, per-router tests, and the
  # parity-claims contract block in docs/DOC_VS_CODE_GAP_AUDIT.md are all
  # parsed and diffed against code. Exit 1 fails the build.
  # Pure stdlib (ast, pathlib, json) - no dependency install needed.
  doc-code-parity:
    name: Doc/code parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check doc-vs-code parity
        run: python3 scripts/check_docs_api_parity.py
