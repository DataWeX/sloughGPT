name: CI

on:
  push:
    branches: [main]
    # Bookkeeping commits (kanban sync, docs) must not start the suite. Before
    # this filter, parallel sessions pushing every 1-5 minutes meant main never
    # finished a single run (card 20261102_025758).
    paths-ignore:
      - ".kanban/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs cancel their own superseded run. Main does NOT: every main run is a
  # different commit and needs its own verdict, and cancelling it meant 24
  # consecutive `cancelled` runs with no result for main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # ONE workspace-root install. npm ci inside a member climbs to the root
      # anyway; a second member install wipes and replaces the root tree
      # (losing next + @webgpu/types -> TS2688 and `next` 127, seen
      # 2026-10-05 on feat/contract-gates run 37267302387). The workspace
      # link for @sloughgpt/strui is created by this install itself.
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
        working-directory: apps/web

  frontend-lib-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # Full suite (843 files), not just lib/: the 700+ component/feature/
      # hook/app tests previously ran in NO CI job (ci_cd test-web is
      # needs:test-strui and strui is red -> skipped forever).
      - run: npm run test
        working-directory: apps/web

  frontend-build:
    name: Vite build
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # ONE workspace-root install — see the typecheck job's comment.
      - run: npm ci --ignore-scripts
      - run: npm run build
        working-directory: apps/web

  frontend-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 45
    # No frontend-build dependency: the 21 specs target the Vite dev server
    # (cypress.config.ts defaults baseUrl to 5173).
    env:
      NEXTAUTH_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # Step-level gate (NOT job-level `if:`): the job must always REPORT its
      # check — a job-level skip can leave a required check "expected" and
      # block merges. When no frontend-relevant path changed, everything
      # below is skipped and the job completes in seconds instead of ~30m
      # (card 20261112_062436). Conservative: any unknown event, missing
      # base, or empty diff → web=true (run, never silently skip).
      - name: Frontend-relevant changes?
        id: fe
        shell: bash
        run: |
          base=""
          case "${{ github.event_name }}" in
            push) base="${{ github.event.before }}" ;;
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base — running"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$base^{commit}" 2>/dev/null || \
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base unreachable — running"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null || true)
          echo "changed files:"; echo "$files"
          if [ -z "$files" ]; then
            echo "empty diff — running"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(apps/web/|packages/|\.github/workflows/|package\.json$|package-lock\.json$|tsconfig\.base\.json$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false — no frontend-relevant change" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve Cypress version
        id: cypress
        if: steps.fe.outputs.web == 'true'
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/cypress'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.fe.outputs.web == 'true'
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ steps.cypress.outputs.version }}
      - run: npm ci --ignore-scripts
        if: steps.fe.outputs.web == 'true'
      # --ignore-scripts skips cypress's binary download; fetch it explicitly.
      - run: npx cypress install
        if: steps.fe.outputs.web == 'true'
      - run: npm run e2e:vite
        if: steps.fe.outputs.web == 'true'
        working-directory: apps/web

  python-checks:
    name: Python
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            apps/api/server/requirements.txt
            packages/mogdb/pyproject.toml
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install mogdb
        run: |
          pip install --upgrade pip
          pip install pytest
          # Root pytest.ini filterwarnings reference starlette; the mogdb job
          # otherwise aborts at collection when it is not installed.
          pip install starlette
          pip install -e packages/mogdb
      - name: Syntax check
        run: |
          python3 -m py_compile packages/mogdb/src/mogdb/collection.py
          python3 -m py_compile packages/mogdb/src/mogdb/database.py
      - name: Run mogdb tests
        run: python3 -m pytest packages/mogdb/tests/test_mogdb.py -q -o "addopts=" -o "filterwarnings="

  feature-tags:
    name: Feature Tags
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check feature tags
        run: |
          # domain/ lives at the repo root;
          # the script imports domain.shared._internal.feature_flags.
          PYTHONPATH=. python3 scripts/check_feature_tags.py --validate --check-deletions

  board-integrity:
    name: Board integrity
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify kanban board (schema + unique ids + hash chain)
        # No paths filter on purpose: a corrupted board must redden EVERY
        # PR, not just the ones that touch it — merge 5e5c8ce36 shipped
        # 975 duplicate rows with no gate watching the real file
        # (card 20261029). Stdlib-only; the script self-locates
        # packages/grib/src for the chain verifier.
        run: python3 scripts/check_board_chain.py
      - name: Kanban export freshness (sync producer alarm)
        # The canonical store lives outside CI; kanban-sync.timer mirrors it
        # into .kanban/board.jsonl + .kanban/manifest.json
        # (card 20261031_084842). A dead producer means GitHub board history
        # goes stale silently — this reddens instead. Stdlib-only.
        run: python3 scripts/check_kanban_freshness.py --max-age-minutes 120
