name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # ONE workspace-root install. npm ci inside a member climbs to the root
      # anyway; a second member install wipes and replaces the root tree
      # (losing next + @webgpu/types -> TS2688 and `next` 127, seen
      # 2026-10-05 on feat/contract-gates run 37267302387). The workspace
      # link for @sloughgpt/strui is created by this install itself.
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
        working-directory: apps/web

  frontend-lib-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # Full suite (843 files), not just lib/: the 700+ component/feature/
      # hook/app tests previously ran in NO CI job (ci_cd test-web is
      # needs:test-strui and strui is red -> skipped forever).
      - run: npm run test
        working-directory: apps/web

  frontend-build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # ONE workspace-root install — see the typecheck job's comment.
      - run: npm ci --ignore-scripts
      - run: npm run build
        working-directory: apps/web

  frontend-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # No frontend-build dependency: the 21 specs target the Vite dev server
    # (cypress.config.ts defaults baseUrl to 5173; next-compat shims are
    # react-router-backed and SSR under `next start` throws useLocation()).
    # The Vite server needs no .next production build.
    env:
      NEXTAUTH_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # Cache the Cypress binary (~120 MB) keyed on the exact lockfile
      # version — `npx cypress install` skips the download when warm.
      - name: Resolve Cypress version
        id: cypress
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/cypress'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ steps.cypress.outputs.version }}
      - run: npm ci --ignore-scripts
      # --ignore-scripts skips cypress's binary download; fetch it explicitly.
      - run: npx cypress install
      - run: npm run e2e:vite
        working-directory: apps/web

  python-checks:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            apps/api/server/requirements.txt
            packages/mogdb/pyproject.toml
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install mogdb
        run: |
          pip install --upgrade pip
          pip install pytest
          # Root pytest.ini filterwarnings reference starlette; the mogdb job
          # otherwise aborts at collection when it is not installed.
          pip install starlette
          pip install -e packages/mogdb
      - name: Syntax check
        run: |
          python3 -m py_compile packages/mogdb/src/mogdb/collection.py
          python3 -m py_compile packages/mogdb/src/mogdb/database.py
      - name: Run mogdb tests
        run: python3 -m pytest packages/mogdb/tests/test_mogdb.py -q -o "addopts=" -o "filterwarnings="

  feature-tags:
    name: Feature Tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check feature tags
        run: |
          # domain/ lives at the repo root (packages/core-py has no domain/);
          # the script imports domain.shared._internal.feature_flags.
          PYTHONPATH=.:packages/core-py python3 scripts/check_feature_tags.py --validate --check-deletions
