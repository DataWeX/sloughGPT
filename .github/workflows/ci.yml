name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/strui/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: packages/strui
      - name: Ensure @sloughgpt/strui symlink
        run: |
          if [ ! -L node_modules/@sloughgpt/strui ] && [ ! -d node_modules/@sloughgpt/strui ]; then
            mkdir -p node_modules/@sloughgpt
            ln -sfn ../../../../packages/strui node_modules/@sloughgpt/strui
          fi
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web

  frontend-lib-tests:
    name: Frontend lib tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/strui/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:lib
        working-directory: apps/web

  frontend-build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/strui/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci --omit=peer
        working-directory: packages/strui
      - run: npm run build
        working-directory: apps/web

  frontend-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [frontend-build]
    env:
      NEXTAUTH_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/strui/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci --omit=peer
        working-directory: packages/strui
      - run: npm run build
        working-directory: apps/web
      - run: npx start-server-and-test "npx next start -p 3010" http://localhost:3010 "npx cypress run --config baseUrl=http://localhost:3010"
        working-directory: apps/web

  python-checks:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            apps/api/server/requirements.txt
            packages/mogdb/pyproject.toml
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install mogdb
        run: |
          pip install --upgrade pip
          pip install pytest
          pip install -e packages/mogdb
      - name: Syntax check
        run: |
          python3 -m py_compile packages/mogdb/src/mogdb/collection.py
          python3 -m py_compile packages/mogdb/src/mogdb/database.py
      - name: Run mogdb tests
        run: python3 -m pytest packages/mogdb/tests/test_mogdb.py -q -o "addopts="

  feature-tags:
    name: Feature Tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check feature tags
        run: |
          PYTHONPATH=packages/core-py python3 scripts/check_feature_tags.py --validate --check-deletions
