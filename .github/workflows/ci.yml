name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # ONE workspace-root install. npm ci inside a member climbs to the root
      # anyway; a second member install wipes and replaces the root tree
      # (losing next + @webgpu/types -> TS2688 and `next` 127, seen
      # 2026-10-05 on feat/contract-gates run 37267302387). The workspace
      # link for @sloughgpt/strui is created by this install itself.
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
        working-directory: apps/web

  frontend-lib-tests:
    name: Frontend lib tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:lib
        working-directory: apps/web

  frontend-build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # ONE workspace-root install — see the typecheck job's comment.
      - run: npm ci --ignore-scripts
      - run: npm run build
        working-directory: apps/web

  frontend-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [frontend-build]
    env:
      NEXTAUTH_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # ONE workspace-root install — see the typecheck job's comment.
      - run: npm ci --ignore-scripts
      - run: npm run build
        working-directory: apps/web
      # --ignore-scripts skips cypress's binary download; fetch it explicitly.
      - run: npx cypress install
      - run: npx start-server-and-test "npx next start -p 3010" http://localhost:3010 "npx cypress run --config baseUrl=http://localhost:3010"
        working-directory: apps/web

  python-checks:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            apps/api/server/requirements.txt
            packages/mogdb/pyproject.toml
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install mogdb
        run: |
          pip install --upgrade pip
          pip install pytest
          # Root pytest.ini filterwarnings reference starlette; the mogdb job
          # otherwise aborts at collection when it is not installed.
          pip install starlette
          pip install -e packages/mogdb
      - name: Syntax check
        run: |
          python3 -m py_compile packages/mogdb/src/mogdb/collection.py
          python3 -m py_compile packages/mogdb/src/mogdb/database.py
      - name: Run mogdb tests
        run: python3 -m pytest packages/mogdb/tests/test_mogdb.py -q -o "addopts=" -o "filterwarnings="

  feature-tags:
    name: Feature Tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check feature tags
        run: |
          # domain/ lives at the repo root (packages/core-py has no domain/);
          # the script imports domain.shared._internal.feature_flags.
          PYTHONPATH=.:packages/core-py python3 scripts/check_feature_tags.py --validate --check-deletions
