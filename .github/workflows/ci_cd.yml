name: CI/CD

on:
  push:
    branches: [main, develop]
    # Same rule as CI: bookkeeping pushes do not need the build/deploy suite.
    paths-ignore:
      - ".kanban/**"
      - "docs/**"
      - "**.md"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: sloughgpt-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only superseded PR runs; a main run is a distinct commit that needs
  # its own verdict (card 20261102_025758).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: datawex/sloughgpt

jobs:
  # ─── Lint (Python) ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/server/requirements.txt
            pyproject.toml
      # Pinned to the shared toolchain's version (conda env = ruff 0.16.8).
      # CI was installing latest, whose import-sorting rules flagged 11 I001s
      # that pass locally -- one toolchain, one verdict (card ca647de2).
      # The follow-up probe proved the pin was not the cause (same version,
      # same config, same bytes on both sides); the real cause was isort
      # first-party classification probing a machine-local domain symlink.
      # Fixed declaratively: known-first-party = ["domain"] in pyproject.toml.
      - run: pip install ruff==0.16.8 mypy
      # Ruff lint covers the WHOLE tree (card 20261102_031702): pre-commit
      # formats only staged files, so anything outside these trees silently
      # fell behind (a real I001 in scripts/finetune_gpt2.py survived the old
      # 2-tree gate). Fresh measurement at the widening (ruff 0.16.8): check 1
      # error, format 46 files — both cleared in the same commit.
      - name: Ruff lint
        run: |
          ruff --version
          ruff check domain journeys packages apps scripts tests --exclude '__pycache__'
      # domain/ + cli.py joined the format gate with card 20261106_071811
      # (their 23 drifted files are formatted in the same commit); the check
      # line already covered domain/, only the format verdict lagged.
      # Card 20261102_031702 widened the remaining trees the same way.
      - name: Ruff format check
        run: ruff format --check domain journeys packages apps scripts tests cli.py --exclude '__pycache__'
      - name: Mypy type check
        run: mypy domain/ apps/api/server/ --ignore-missing-imports --no-error-summary || true
      # Build-context rot: a COPY source that is missing, or excluded by
      # .dockerignore, kills `docker build` — caught here on every commit,
      # because moving a directory breaks a Dockerfile without editing it
      # (card 20261027_070731_infra-dockerfile-rot-gate).
      - name: Dockerfile build-context check
        run: python scripts/check_dockerfile_contexts.py

  # ─── Core Python tests (tests/core-py) ───────────────────────
  test-core-py:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    # 120 (was 90): main's run is now TWO passes (coverage gate, then
    # testmon record — the CTracer LIFO clash, run 44542985298). Measured
    # on run 44748601711 (contended runner): pass 1 = 47m27s, pass 2 was
    # at 99% after 15.5m with the same ~31m slow-test tail pass 1 had →
    # ~97m need vs the 90m budget; the timeout killed pass 2 ~5 min
    # before completion (record + save skipped). Uncontended baseline:
    # 35m51s + 19m15s ≈ 55m (card 20261104_085623).
    # Sharded (card 20261107_112103): each shard runs BOTH passes over 1/4
    # of the suite, so 120 now has ~4x headroom — kept (not lowered) so a
    # slow shard never dies mid-gate.
    timeout-minutes: 120
    # -n auto inside ONE job tops out at the runner's 2 CPUs (the CI log
    # says "created: 2/2 workers" — measured 1.45x vs the 50m19s serial
    # baseline), so the lever that adds hardware is N shards on N runners.
    # Each main-push shard gets SLO_TEST_SHARD=k/4 (tests/shard_split.py:
    # round-robin, disjoint + complete, unset/empty = exact no-op) and
    # carries its coverage data + testmon recording out as artifacts; two
    # jobs below recombine them (a quarter of the suite cannot hold a
    # whole-suite floor, and PRs restore ONE .testmondata). PRs keep the
    # single unsharded affected-closure run — matrix collapses to [1].
    strategy:
      fail-fast: false  # a red shard must not cancel its siblings — keep the evidence
      matrix:
        group: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[1,2,3,4]') }}
    env:
      COVERAGE_FILE: .coverage.shard${{ matrix.group }}
      # Empty on PRs (the hook treats "" as unset); "k/4" on main pushes.
      SLO_TEST_SHARD: ${{ github.event_name != 'pull_request' && format('{0}/4', matrix.group) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torch/transformers/peft removed 2026-11-12: domain/ is torch-free
          # (own engine), the suite runs green without them, and the two
          # torch-touching tests importorskip by design (card 20261112_062436).
          # pyyaml: transformers used to supply it transitively —
          # domain/benchmark/weighted.py imports it at module level.
          python -m pip install fastapi uvicorn pydantic httpx numpy scipy psutil python-multipart requests pillow pyyaml
          # pytest-testmon: PRs select the affected closure against main's
          # recording; main's full run records it (card 20261104_085623).
          python -m pip install pytest pytest-cov pytest-asyncio pytest-xdist pytest-timeout pytest-testmon
          # test_vfs_addon.py imports lz4 at module scope -> collection error
          python -m pip install lz4

      # ── seam gate: command parity always runs on PRs (card 20261104_085623) ──
      # Testmon selection is dependency-based, so for most diffs the parity
      # test isn't selected — yet a Command Rule gate must not ride on
      # selection (Test Rule clause 4: seam gates run when their surface is
      # touched). Seconds: 7 passed / 4 xfailed baseline, ~1.5s. Main's full
      # run below covers it anyway (same tests/core-py/ scope); this step
      # only closes the PR-mode gap — duplicate run on selection is noise-free.
      - name: Command parity (seam gate, always on PRs)
        if: github.event_name == 'pull_request'
        run: python -m pytest tests/core-py/test_command_parity.py -q --tb=short

      # ── PR mode: affected closure (Test Rule clause 3, card 20261104_085623) ──
      # The testmon DB is written ONLY by main's full runs (single writer: a
      # partial PR record would poison the canonical selection state). PRs
      # restore main's freshest recording and select against it; a cache miss
      # (first run after this card lands) degrades to run_affected's
      # documented full-record fallback — unknown state is a full run, never
      # a guess. Coverage is deliberately absent here: a % measured on the
      # affected closure measures the subset, not the codebase — the 50%
      # floor stays on main's full run, where it measures the whole tree.
      # The seam gates (contract, feature tags, board, lint) are separate
      # seconds-jobs and run unchanged on every PR; command parity runs as
      # the always-on step above (in-job — the env is already set up).
      - name: Restore testmon DB (PR selection basis)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .testmondata
          key: testmon-v1-${{ github.sha }}
          restore-keys: |
            testmon-v1-

      - name: Run affected core-py tests (PR)
        if: github.event_name == 'pull_request'
        env:
          # A runner tears down at job end: phase 2 must run before exit
          # (else the deferred slow paths would silently never run —
          # deselected tests), and its red must fail THIS job rather than
          # warn the next invocation.
          RUN_AFFECTED_FOREGROUND_SLOW: "1"
        run: |
          # Same scope + ignores as the full run below; selection is
          # pytest-testmon over main's recording (mechanical, not filename
          # guessing — shared utils and transitive imports are picked up).
          # --dist loadfile: same file/worker pairing as the main passes —
          # without it PR runs used xdist's default `load`, re-splitting
          # same-file tests across workers and deterministically failing the
          # placement-sensitive set (warmth, RAG %d, test_a/b handoff,
          # TestPersonas save→get, pugqeep) that main's loadfile shards pass.
          ./scripts/run_affected.sh tests/core-py/ \
            --ignore=tests/core-py/test_server_integration.py \
            --ignore=tests/core-py/test_process_isolation.py \
            --ignore=tests/core-py/test_numpy_engine.py \
            --ignore=tests/core-py/test_safetensors_loader.py \
            --ignore=tests/core-py/test_morph_tokenizer.py \
            --ignore=tests/core-py/test_point_library.py \
            --ignore=tests/core-py/test_slonet_compute_sensitivity.py \
            --ignore=tests/core-py/test_slonet_provider.py \
            --ignore=tests/core-py/test_shell_repl.py \
            -q --tb=short -n auto --dist loadfile

      # ── merge to main: the full suite — unchanged, the backstop ──
      # TWO separate pytest passes, deliberately. Main run 44542985298
      # (2026-11-19) proved the single-pass unification crashes: pytest-cov
      # and pytest-testmon each drive coverage's CTracer, and under xdist
      # their collectors stop OUT of LIFO order at session end
      # (coverage/collector.py: assert self._collectors[-1] is self) →
      # INTERNALERROR exit 3 AFTER all 42596 tests had passed
      # ("Expected current collector to be <CTracer>, but it's <CTracer>").
      # Each pass alone is CI-proven: pass 1 is the pre-card behavior; pass
      # 2 with --testmon-noselect and NO coverage is every PR run of #353
      # (19m15s for the full record). tests/test_workflow_testmon_split.py
      # pins the split — never re-merge them into one command.
      - name: Run core-py tests (full suite backstop)
        if: github.event_name != 'pull_request'
        run: |
          # 2026-10-25 test-tree consolidation: tests moved from
          # packages/core-py/tests/ to the unified tests/ root (tests/core-py/).
          # Job ID kept — it is the required check name. The old --cov=.
          # (run from inside packages/core-py) measured the package tree, which
          # then CONTAINED the test_*_coverage.py driver modules (→ a bogus 97%
          # that counted test files). After the move that tree was nearly
          # empty, so --cov=packages/core-py collected 0 lines → fail-under=50
          # always reddened (card 20261031_080004). Coverage now points at the
          # domain library the tests actually import, so the 50% floor measures
          # real source. Source of truth: pyproject [tool.coverage.run] source.
          # -n auto: xdist workers (installed above; pytest-cov combines
          # distributed coverage natively). Serial test-core-py was 50m19s
          # on 2026-11-11; -n auto alone measured only 1.45x (2-worker
          # ceiling — "created: 2/2 workers"), so this job is now SHARDED
          # across runners too (card 20261107_112103, SLO_TEST_SHARD env
          # above). PASS 1 = the coverage gate ONLY. No testmon here: see
          # the two-pass comment above (collector clash, run 44542985298).
          # --cov-report=: 4 partial percentages in the logs would read as
          # red; the combine job prints the one true report.
          # --cov-fail-under=0: the floor moved to test-core-py-coverage
          # (a quarter of the suite cannot be judged against a whole-tree
          # floor, and pyproject's fail_under = 50 would otherwise be
          # inherited per shard — pytest_cov/plugin.py:270).
          # --durations=25: straggler profile per shard (the local box
          # can't instrument this run — shared with other sessions).
          # --dist loadfile: one file = one xdist worker, in collection
          # order — module-global handoffs and save→load disk chains (run
          # 45361359978) need BOTH the file-grouped SLO_TEST_SHARD split
          # and this worker split to stay intact.
          python -m pytest tests/core-py/ \
            --ignore=tests/core-py/test_server_integration.py \
            --ignore=tests/core-py/test_process_isolation.py \
            --ignore=tests/core-py/test_numpy_engine.py \
            --ignore=tests/core-py/test_safetensors_loader.py \
            --ignore=tests/core-py/test_morph_tokenizer.py \
            --ignore=tests/core-py/test_point_library.py \
            --ignore=tests/core-py/test_slonet_compute_sensitivity.py \
            --ignore=tests/core-py/test_slonet_provider.py \
            --ignore=tests/core-py/test_shell_repl.py \
            --cov=domain --cov-report= --cov-fail-under=0 \
            -q --tb=short -n auto --dist loadfile --durations=25

      - name: Record testmon DB (full suite, no coverage)
        if: github.event_name != 'pull_request'
        run: |
          # PASS 2 = the recording ONLY, no coverage (same 9 ignores as
          # pass 1 — the recorded closure must match the gated closure).
          # --testmon-noselect: run EVERYTHING (nothing deselected) while
          # RECORDING each test's file dependencies — this recording is the
          # DB PRs select against; plain pytest writes no testmon data.
          # No --cov here by design: the two CTracers clash under xdist
          # (run 44542985298, traceback in the comment above). Measured on
          # #353's PR runs: full record without coverage = 19m15s; on main
          # run 44748601711 (contended) pass 2 hit 99% after 15.5m and
          # needed the same ~31m slow-test tail pass 1 had → budget 120m.
          # Sharded like pass 1 (SLO_TEST_SHARD): each runner records its
          # quarter into .testmondata, and test-core-py-record-merge below
          # recombines them into the ONE DB the PR restore step serves.
          # --dist loadfile: same file/worker pairing as pass 1, so a
          # re-recorded file re-runs in its own collection order.
          python -m pytest tests/core-py/ \
            --ignore=tests/core-py/test_server_integration.py \
            --ignore=tests/core-py/test_process_isolation.py \
            --ignore=tests/core-py/test_numpy_engine.py \
            --ignore=tests/core-py/test_safetensors_loader.py \
            --ignore=tests/core-py/test_morph_tokenizer.py \
            --ignore=tests/core-py/test_point_library.py \
            --ignore=tests/core-py/test_slonet_compute_sensitivity.py \
            --ignore=tests/core-py/test_slonet_provider.py \
            --ignore=tests/core-py/test_shell_repl.py \
            --testmon-noselect \
            -q --tb=short -n auto --dist loadfile

      # Per-shard fragments leave as artifacts (the single-writer cache
      # save moved to test-core-py-record-merge — PRs restore ONE DB, so
      # the shards must be verified-merged before anything is persisted).
      # include-hidden-files: upload-artifact v4.4+ excludes dotfiles by
      # default, and both artifacts ARE dotfiles. Glob (not bare name):
      # .testmondata* also carries a WAL sidecar if the runner tore down
      # mid-checkpoint; the merge script folds it in.
      # retention-days: pure intra-run plumbing — no value after the run.
      - name: Upload coverage shard
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.group }}
          path: .coverage.shard${{ matrix.group }}*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload testmon recording shard
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: testmondata-${{ matrix.group }}
          path: .testmondata*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ─── Whole-suite coverage floor (shards measure, this decides) ──
  # Card 20261107_112103: each shard measures only its quarter of the
  # suite, so --cov-fail-under cannot live on a shard (pyproject's
  # fail_under = 50 would be inherited per subset — pytest_cov:270 —
  # and a quarter of tests measures a quarter of nothing). The floor is
  # evaluated here on the COMBINED data; pyproject
  # [tool.coverage.report] fail_under = 50 stays the single declaration.
  test-core-py-coverage:
    needs: [test-core-py]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout: pyproject carries the coverage config, and `coverage
      # report` prints per-file rows that need the source tree present.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install coverage
        run: python -m pip install --quiet coverage
      - name: Download coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine shards and enforce the 50% floor
        run: |
          # Bare combine globs .coverage.* — every shard fragment plus
          # any leftover worker-suffixed siblings from the runs.
          coverage combine
          coverage report

  # ─── Single-writer testmon DB: merge the recording shards ──────
  # PRs restore ONE .testmondata (test-core-py's restore step), so the
  # per-shard recordings become one DB here. scripts/merge_testmon.py
  # verifies the union is EXACT (row counts per table + a union check on
  # shared fingerprints + PRAGMA foreign_key_check) and removes the
  # output on any violation: an under-selecting DB would silently skip
  # affected tests on PRs — strictly worse than no DB, where
  # run_affected's documented fallback runs everything (over-selecting,
  # the safe direction). Cache save keeps the original single-writer
  # rule verbatim: main only, continue-on-error for re-run keys — a
  # missed save merely over-selects on the next PR.
  test-core-py-record-merge:
    needs: [test-core-py]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4   # scripts/merge_testmon.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download testmon shards
        uses: actions/download-artifact@v8
        with:
          pattern: testmondata-*
          # Deliberately NOT merge-multiple: every artifact holds a file
          # named .testmondata — merged into one dir they would overwrite
          # each other. Each lands in its own artifact-named dir instead.
      - name: Merge shards into .testmondata (verified exact)
        run: python scripts/merge_testmon.py .testmondata testmondata-*/.testmondata
      - name: "Save testmon DB (single writer: main only)"
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .testmondata
          key: testmon-v1-${{ github.sha }}

  # ─── Server API tests ───────────────────────────────────────────
  test-server:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyyaml: was a transformers transitive dep; domain/benchmark/weighted.py
          # + routers/benchmark.py import it at module level (run 43180934654).
          python -m pip install fastapi uvicorn pydantic httpx numpy scipy psutil python-multipart requests pillow pyyaml
          # pytest-cov was missing here (every other python job has it): the
          # --cov flags made pytest exit 4 before collecting a single test.
          python -m pip install pytest pytest-cov pytest-asyncio
          # apps/api/server imports mogdb (training/webhooks.py); install it so
          # the server test suite can collect.
          python -m pip install -e packages/mogdb

      - name: Run server tests
        working-directory: apps/api/server
        env:
          # apps/api/server FIRST so `tests` resolves to the server test
          # package -- repo-root tests/ shadows it otherwise (the standing
          # test_support collection errors). Root + shared packages follow.
          PYTHONPATH: ${{ github.workspace }}/apps/api/server:${{ github.workspace }}:${{ github.workspace }}/packages/downcraft
        # --cov=src pointed at a directory that does not exist; the server
        # code lives in these packages.
        run: python -m pytest tests/ --cov=infrastructure --cov=routers --cov=controllers --cov-report=term-missing --cov-fail-under=30 -q --tb=short

  # ─── Contract gate (descriptor → projection → registration) ────
  # Blocking: router manifest freshness, descriptor validation, and the
  # registry's claim matching the routes FastAPI actually serves.
  # Report-only (printed, exit 0): route-baseline drift and hand-written
  # route duplicates, until the grandfathered backlog clears.
  contract-gate:
    name: Contract gate
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      # Stdlib-only checks run first: they need no install at all.
      - name: Router manifest is fresh (generated, not hand-edited)
        run: python scripts/gen_router_manifest.py --check

      - name: Descriptor contract check (static)
        run: python scripts/check_contract.py --static

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic httpx numpy scipy psutil python-multipart requests pillow
          python -m pip install -e packages/mogdb

      - name: Projection matches the served route table (runtime)
        env:
          PYTHONPATH: .:apps/api/server:packages/downcraft
        run: python scripts/check_contract.py --runtime

  # ─── Root-level Python tests (tests/) ───────────────────────────
  test-root:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyyaml + setuptools: transitive deps of the removed torch tree (run
          # 43180934654) — 4 root suites import yaml top-level;
          # test_packaging_config.py imports setuptools.
          # pillow: tests/test_gallery_generators.py (c5a3b45e9) generates
          # real PNGs via domain.multimodal — without it 5 tests raise
          # "Pillow library required" (main runs 44712585390/44708416860;
          # test-core-py already installs pillow).
          python -m pip install fastapi uvicorn pydantic httpx numpy scipy psutil python-multipart requests pillow pyyaml setuptools
          python -m pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout
          python -m pip install -e packages/mogdb

      - name: Run root tests
        run: |
          python -m pytest tests/ \
            --override-ini="testpaths=tests" \
            --override-ini="addopts=" \
            --ignore=tests/test_checkpoint_utils.py \
            --ignore=tests/test_knowledge_graph.py \
            --ignore=tests/test_lm_eval_char.py \
            --ignore=tests/test_rag.py \
            --ignore=tests/server/ \
            --ignore=tests/core-py/ \
            --ignore=tests/test_auto_train_integration.py \
            --ignore=tests/test_chat_loop_e2e.py \
            --ignore=tests/test_chat_trainer.py \
            --ignore=tests/test_cli_chat.py \
            --ignore=tests/test_continual_learner.py \
            --ignore=tests/test_websocket_training.py \
            --ignore=tests/test_training_monitor.py \
            -q --tb=short

      # planner + grib suites (added 2026-10-28 with the canonical-state
      # PR): these never ran in CI before — root conftest puts both src dirs on
      # the path, so a bare import works here without an editable install.
      - name: Run planner suites
        run: |
          python -m pytest packages/grib/tests packages/planner/tests \
            --override-ini="addopts=" \
            --import-mode=importlib \
            -q --tb=short

  # ─── Frontend: strui (typecheck + test) ─────────────────────────
  test-strui:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/strui/package-lock.json
      - name: Install + lint + typecheck + test
        working-directory: packages/strui
        run: |
          npm ci --ignore-scripts
          npm run lint
          npx tsc --noEmit
          npx vitest run

  # ─── Frontend: web (lint + typecheck + test + build) ────────────
  test-web:
    runs-on: ubuntu-latest
    needs: [test-strui]
    # Bound the job so a hung vitest/build fails in 2h instead of burning the
    # 6h default (the test-core-py lesson — no timeout-minutes anywhere).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Step-level gate (NOT job-level `if:`): the check must always report
      # (job-level skip → required check stuck "expected"). No frontend-
      # relevant change → install/lint/typecheck/test/build all skip; the job
      # reports success in seconds (card 20261112_062436). Conservative:
      # unknown event / missing base / empty diff → web=true (run).
      - name: Frontend-relevant changes?
        id: fe
        shell: bash
        run: |
          base=""
          case "${{ github.event_name }}" in
            push) base="${{ github.event.before }}" ;;
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base — running"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$base^{commit}" 2>/dev/null || \
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base unreachable — running"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null || true)
          echo "changed files:"; echo "$files"
          if [ -z "$files" ]; then
            echo "empty diff — running"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(apps/web/|packages/|\.github/workflows/|package\.json$|package-lock\.json$|tsconfig\.base\.json$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false — no frontend-relevant change" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # One workspace install at the repo root — the local shared-tree layout.
      # npm ci inside a workspace subdir resolves the workspace root and
      # installs there anyway, so the previous split (apps/web, then
      # packages/strui) ended with the strui tree wiping the web tree.
      # The root install also links @sloughgpt/strui automatically, so the old
      # manual symlink step is no longer needed.
      - run: npm ci --ignore-scripts
        if: steps.fe.outputs.web == 'true'

      - name: Lint
        if: steps.fe.outputs.web == 'true'
        working-directory: apps/web
        run: npx eslint . --max-warnings 900

      - name: Typecheck
        if: steps.fe.outputs.web == 'true'
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit tests
        if: steps.fe.outputs.web == 'true'
        working-directory: apps/web
        run: npx vitest run

      - name: Build
        if: steps.fe.outputs.web == 'true'
        working-directory: apps/web
        run: npm run build

  # ─── Python SDK tests ──────────────────────────────────────────
  test-sdk-py:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install + test
        run: |
          python -m pip install --upgrade pip requests httpx pytest pytest-asyncio
          cd packages/sdk-py/sloughgpt_sdk
          python -m pytest ../../../tests/test_sdk.py -v --tb=short

  # ─── TypeScript SDK (lint + typecheck + build + test) ──────────
  test-sdk-ts:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk-ts/typescript-sdk/package-lock.json
      - name: Install + lint + typecheck + build + test
        working-directory: packages/sdk-ts/typescript-sdk
        run: |
          npm ci --ignore-scripts
          npm run ci

  # ─── Docker build + push ────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 45
    needs: [lint, test-core-py, test-core-py-coverage, test-core-py-record-merge, test-server, test-strui, test-web, test-sdk-py, test-sdk-ts, test-root]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build + push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}

      - name: Build + push CLI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.cli
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-cli:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-cli:${{ github.sha }}

  # ─── Deploy: pull-based compose on the host (release only) ──────
  # USER RULING 2026-10-27: "fastest + cheapest target = pull-based
  # compose deploy on the host." The job that used to live here only
  # ECHOED `kubectl set image ...` while reporting a green run — the
  # second-writer anti-pattern this replaces: it deployed nothing.
  # The Helm chart (infra/helm/sloughgpt/) is deliberately NOT used:
  # the user declined that direction.
  #
  # It stays release-only (github.event_name == 'release'). Widening it
  # to fire on every main push is a product decision, not this card's.
  deploy:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 45
    needs: [build]
    if: github.event_name == 'release'
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      # Secrets live on the `production` environment, so they are checked in
      # a STEP — the `secrets` context is not readable from a job-level
      # `if:`. Missing credentials must FAIL the release, never skip it
      # silently and never report success without deploying.
      - name: Verify deploy credentials
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$TS_AUTHKEY" ]     || missing="$missing TS_AUTHKEY"
          [ -n "$DEPLOY_HOST" ]    || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::release deploy cannot run — missing secrets:$missing"
            exit 1
          fi
          echo "credentials present (host=$DEPLOY_HOST)"

      # Same transport as deploy-git-sync.yml: Tailscale + SSH + rsync.
      # Ported, not rebuilt.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      # Ship the compose project at its REPO-RELATIVE path (/opt/sloughgpt/
      # infra/docker/) so the compose file's `context: ../..` and its
      # `./prometheus.prod.yml`, `./grafana/`, `./docker/nginx/` references
      # still resolve. Host secrets are NEVER overwritten — every .env* is
      # excluded; the host owns its own credentials.
      - name: Sync compose project to host
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }} "mkdir -p /opt/sloughgpt/infra/docker"
          rsync -avz \
            -e "ssh -i ~/.ssh/id_rsa" \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '__pycache__' \
            infra/docker/ ${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }}:/opt/sloughgpt/infra/docker/

      # Pull the sha-tagged images the build job above actually published
      # (ghcr.io/datawex/sloughgpt{,-web}), then restart the stack.
      # `pull` exits non-zero when a tag does not exist, so an unpublished
      # sha fails here instead of pretending to deploy.
      - name: Pull sha-tagged images + restart stack
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          VERSION: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" \
            "export VERSION='$VERSION'; bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/sloughgpt/infra/docker
          if [ ! -f .env ]; then
            echo "ERROR: /opt/sloughgpt/infra/docker/.env is missing on this host." >&2
            echo "Provision it first (keys: POSTGRES_PASSWORD, REDIS_PASSWORD," >&2
            echo "GRAFANA_ADMIN_PASSWORD, SLO_JWT_SECRET, SLO_API_KEY) — see" >&2
            echo "infra/docker/.env.production in the repo." >&2
            exit 1
          fi
          compose() { docker compose -f docker-compose.prod.yml --env-file .env "$@"; }

          # api/web are the images ci_cd.yml publishes sha-tagged. gateway is
          # NOT published by CI (no build job for it) — it is excluded so it
          # cannot silently resolve to a stale or absent registry tag, and
          # `--no-build` stops compose from quietly building it on the host.
          # CI coverage for gateway/gpu/dev is a separate card.
          compose pull api web

          services=$(compose config --services)
          services=$(printf '%s\n' "$services" | grep -vx gateway || true)
          [ -n "$services" ] || { echo "ERROR: no deployable services resolved" >&2; exit 1; }
          compose up -d --no-build $services
          compose ps
          echo "deployed VERSION=$VERSION"
          REMOTE


  # ─── Benchmark (main only) ─────────────────────────────────────
  benchmark:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 30
    # coverage + record-merge included: before sharding, a red coverage
    # gate or record step failed test-core-py itself and blocked this
    # job — same verdict, new job ids.
    needs: [test-core-py, test-core-py-coverage, test-core-py-record-merge]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt
      - name: Install + benchmark
        run: |
          python -m pip install --upgrade pip
          # torch stays HERE only: scripts/tools/performance_test.py imports
          # torch at module level (torch-era benchmark — every other job dropped
          # torch 2026-11-12, card 20261112_062436; own-engine perf = own card).
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers numpy
          python scripts/tools/performance_test.py --test latency --runs 5 --tokens 20
