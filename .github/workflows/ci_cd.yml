name: CI/CD

on:
  push:
    branches: [main, develop]
    # Same rule as CI: bookkeeping pushes do not need the build/deploy suite.
    paths-ignore:
      - ".kanban/**"
      - "docs/**"
      - "**.md"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: sloughgpt-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only superseded PR runs; a main run is a distinct commit that needs
  # its own verdict (card 20261102_025758).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: datawex/sloughgpt

jobs:
  # ─── Lint (Python) ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/server/requirements.txt
            pyproject.toml
      # Pinned to the shared toolchain's version (conda env = ruff 0.16.8).
      # CI was installing latest, whose import-sorting rules flagged 11 I001s
      # that pass locally -- one toolchain, one verdict (card ca647de2).
      # The follow-up probe proved the pin was not the cause (same version,
      # same config, same bytes on both sides); the real cause was isort
      # first-party classification probing a machine-local domain symlink.
      # Fixed declaratively: known-first-party = ["domain"] in pyproject.toml.
      - run: pip install ruff==0.16.8 mypy
      - name: Ruff lint
        run: |
          ruff --version
          ruff check domain/ apps/api/server/ --exclude '__pycache__'
      # domain/ + cli.py joined the format gate with card 20261106_071811
      # (their 23 drifted files are formatted in the same commit); the check
      # line already covered domain/, only the format verdict lagged.
      - name: Ruff format check
        run: ruff format --check domain/ cli.py apps/api/server/ --exclude '__pycache__'
      - name: Mypy type check
        run: mypy domain/ apps/api/server/ --ignore-missing-imports --no-error-summary || true
      # Build-context rot: a COPY source that is missing, or excluded by
      # .dockerignore, kills `docker build` — caught here on every commit,
      # because moving a directory breaks a Dockerfile without editing it
      # (card 20261027_070731_infra-dockerfile-rot-gate).
      - name: Dockerfile build-context check
        run: python scripts/check_dockerfile_contexts.py

  # ─── Core Python tests (tests/core-py) ───────────────────────
  test-core-py:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torch/transformers/peft removed 2026-11-12: domain/ is torch-free
          # (own engine), the suite runs green without them, and the two
          # torch-touching tests importorskip by design (card 20261112_062436).
          python -m pip install fastapi uvicorn pydantic httpx numpy scipy psutil python-multipart requests pillow
          python -m pip install pytest pytest-cov pytest-asyncio pytest-xdist pytest-timeout
          # test_vfs_addon.py imports lz4 at module scope -> collection error
          python -m pip install lz4

      - name: Run core-py tests
        run: |
          # 2026-10-25 test-tree consolidation: tests moved from
          # packages/core-py/tests/ to the unified tests/ root (tests/core-py/).
          # Job ID kept — it is the required check name. The old --cov=.
          # (run from inside packages/core-py) measured the package tree, which
          # then CONTAINED the test_*_coverage.py driver modules (→ a bogus 97%
          # that counted test files). After the move that tree was nearly
          # empty, so --cov=packages/core-py collected 0 lines → fail-under=50
          # always reddened (card 20261031_080004). Coverage now points at the
          # domain library the tests actually import, so the 50% floor measures
          # real source. Source of truth: pyproject [tool.coverage.run] source.
          # -n auto: xdist workers (installed above; pytest-cov combines
          # distributed coverage natively — the 50% floor still measures
          # the whole run). Serial test-core-py was 50m19s on 2026-11-11;
          # this is the duration lever (card 20261112_062436).
          python -m pytest tests/core-py/ \
            --ignore=tests/core-py/test_server_integration.py \
            --ignore=tests/core-py/test_process_isolation.py \
            --ignore=tests/core-py/test_numpy_engine.py \
            --ignore=tests/core-py/test_safetensors_loader.py \
            --ignore=tests/core-py/test_morph_tokenizer.py \
            --ignore=tests/core-py/test_point_library.py \
            --ignore=tests/core-py/test_slonet_compute_sensitivity.py \
            --ignore=tests/core-py/test_slonet_provider.py \
            --ignore=tests/core-py/test_shell_repl.py \
            --cov=domain --cov-report=term-missing --cov-fail-under=50 \
            -q --tb=short -n auto

  # ─── Server API tests ───────────────────────────────────────────
  test-server:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic httpx numpy scipy psutil python-multipart requests pillow
          # pytest-cov was missing here (every other python job has it): the
          # --cov flags made pytest exit 4 before collecting a single test.
          python -m pip install pytest pytest-cov pytest-asyncio
          # apps/api/server imports mogdb (training/webhooks.py); install it so
          # the server test suite can collect.
          python -m pip install -e packages/mogdb

      - name: Run server tests
        working-directory: apps/api/server
        env:
          # apps/api/server FIRST so `tests` resolves to the server test
          # package -- repo-root tests/ shadows it otherwise (the standing
          # test_support collection errors). Root + shared packages follow.
          PYTHONPATH: ${{ github.workspace }}/apps/api/server:${{ github.workspace }}:${{ github.workspace }}/packages/downcraft
        # --cov=src pointed at a directory that does not exist; the server
        # code lives in these packages.
        run: python -m pytest tests/ --cov=infrastructure --cov=routers --cov=controllers --cov-report=term-missing --cov-fail-under=30 -q --tb=short

  # ─── Contract gate (descriptor → projection → registration) ────
  # Blocking: router manifest freshness, descriptor validation, and the
  # registry's claim matching the routes FastAPI actually serves.
  # Report-only (printed, exit 0): route-baseline drift and hand-written
  # route duplicates, until the grandfathered backlog clears.
  contract-gate:
    name: Contract gate
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      # Stdlib-only checks run first: they need no install at all.
      - name: Router manifest is fresh (generated, not hand-edited)
        run: python scripts/gen_router_manifest.py --check

      - name: Descriptor contract check (static)
        run: python scripts/check_contract.py --static

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic httpx numpy scipy psutil python-multipart requests pillow
          python -m pip install -e packages/mogdb

      - name: Projection matches the served route table (runtime)
        env:
          PYTHONPATH: .:apps/api/server:packages/downcraft
        run: python scripts/check_contract.py --runtime

  # ─── Root-level Python tests (tests/) ───────────────────────────
  test-root:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic httpx numpy scipy psutil python-multipart requests
          python -m pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout
          python -m pip install -e packages/mogdb

      - name: Run root tests
        run: |
          python -m pytest tests/ \
            --override-ini="testpaths=tests" \
            --override-ini="addopts=" \
            --ignore=tests/test_checkpoint_utils.py \
            --ignore=tests/test_knowledge_graph.py \
            --ignore=tests/test_lm_eval_char.py \
            --ignore=tests/test_rag.py \
            --ignore=tests/server/ \
            --ignore=tests/core-py/ \
            --ignore=tests/test_auto_train_integration.py \
            --ignore=tests/test_chat_loop_e2e.py \
            --ignore=tests/test_chat_trainer.py \
            --ignore=tests/test_cli_chat.py \
            --ignore=tests/test_continual_learner.py \
            --ignore=tests/test_websocket_training.py \
            --ignore=tests/test_training_monitor.py \
            -q --tb=short

      # planner + grib suites (added 2026-10-28 with the canonical-state
      # PR): these never ran in CI before — root conftest puts both src dirs on
      # the path, so a bare import works here without an editable install.
      - name: Run planner suites
        run: |
          python -m pytest packages/grib/tests packages/planner/tests \
            --override-ini="addopts=" \
            --import-mode=importlib \
            -q --tb=short

  # ─── Frontend: strui (typecheck + test) ─────────────────────────
  test-strui:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/strui/package-lock.json
      - name: Install + lint + typecheck + test
        working-directory: packages/strui
        run: |
          npm ci --ignore-scripts
          npm run lint
          npx tsc --noEmit
          npx vitest run

  # ─── Frontend: web (lint + typecheck + test + build) ────────────
  test-web:
    runs-on: ubuntu-latest
    needs: [test-strui]
    # Bound the job so a hung vitest/build fails in 2h instead of burning the
    # 6h default (the test-core-py lesson — no timeout-minutes anywhere).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Step-level gate (NOT job-level `if:`): the check must always report
      # (job-level skip → required check stuck "expected"). No frontend-
      # relevant change → install/lint/typecheck/test/build all skip; the job
      # reports success in seconds (card 20261112_062436). Conservative:
      # unknown event / missing base / empty diff → web=true (run).
      - name: Frontend-relevant changes?
        id: fe
        shell: bash
        run: |
          base=""
          case "${{ github.event_name }}" in
            push) base="${{ github.event.before }}" ;;
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base — running"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$base^{commit}" 2>/dev/null || \
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base unreachable — running"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null || true)
          echo "changed files:"; echo "$files"
          if [ -z "$files" ]; then
            echo "empty diff — running"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(apps/web/|packages/|\.github/workflows/|package\.json$|package-lock\.json$|tsconfig\.base\.json$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false — no frontend-relevant change" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # One workspace install at the repo root — the local shared-tree layout.
      # npm ci inside a workspace subdir resolves the workspace root and
      # installs there anyway, so the previous split (apps/web, then
      # packages/strui) ended with the strui tree wiping the web tree.
      # The root install also links @sloughgpt/strui automatically, so the old
      # manual symlink step is no longer needed.
      - run: npm ci --ignore-scripts
        if: steps.fe.outputs.web == 'true'

      - name: Lint
        if: steps.fe.outputs.web == 'true'
        working-directory: apps/web
        run: npx eslint . --max-warnings 900

      - name: Typecheck
        if: steps.fe.outputs.web == 'true'
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit tests
        if: steps.fe.outputs.web == 'true'
        working-directory: apps/web
        run: npx vitest run

      - name: Build
        if: steps.fe.outputs.web == 'true'
        working-directory: apps/web
        run: npm run build

  # ─── Python SDK tests ──────────────────────────────────────────
  test-sdk-py:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install + test
        run: |
          python -m pip install --upgrade pip requests httpx pytest pytest-asyncio
          cd packages/sdk-py/sloughgpt_sdk
          python -m pytest ../../../tests/test_sdk.py -v --tb=short

  # ─── TypeScript SDK (lint + typecheck + build + test) ──────────
  test-sdk-ts:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk-ts/typescript-sdk/package-lock.json
      - name: Install + lint + typecheck + build + test
        working-directory: packages/sdk-ts/typescript-sdk
        run: |
          npm ci --ignore-scripts
          npm run ci

  # ─── Docker build + push ────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 45
    needs: [lint, test-core-py, test-server, test-strui, test-web, test-sdk-py, test-sdk-ts, test-root]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build + push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}

      - name: Build + push CLI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.cli
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-cli:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-cli:${{ github.sha }}

  # ─── Deploy to K8s (release only) ──────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 45
    needs: [build]
    if: github.event_name == 'release'
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          echo "Deploying release ${{ github.event.release.tag_name }}..."
          echo "Images:"
          echo "  API:  ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "  Web:  ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}"
          echo "  CLI:  ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-cli:${{ github.sha }}"
          echo ""
          echo "To deploy, run:"
          echo "  kubectl set image deployment/sloughgpt-api api=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n sloughgpt"
          echo "  kubectl set image deployment/sloughgpt-web web=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }} -n sloughgpt"

  # ─── Benchmark (main only) ─────────────────────────────────────
  benchmark:
    runs-on: ubuntu-latest
    # A hung step fails the job instead of holding the
    # concurrency group for GitHub's 6-hour default
    # (card 20261102_025758 — test-root hung 6 h on main).
    timeout-minutes: 30
    needs: [test-core-py]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt
      - name: Install + benchmark
        run: |
          python -m pip install --upgrade pip
          # torch stays HERE only: scripts/tools/performance_test.py imports
          # torch at module level (torch-era benchmark — every other job dropped
          # torch 2026-11-12, card 20261112_062436; own-engine perf = own card).
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers numpy
          python scripts/tools/performance_test.py --test latency --runs 5 --tokens 20
