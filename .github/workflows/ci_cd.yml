name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: sloughgpt-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: datawex/sloughgpt

jobs:
  # ─── Lint (Python) ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/server/requirements.txt
            pyproject.toml
      - run: pip install ruff
      - name: Ruff syntax check
        run: ruff check packages/core-py/ apps/api/server/ --select E9,F63,F7,F82 --exclude '__pycache__'

  # ─── Core Python tests (packages/core-py) ───────────────────────
  test-core-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers fastapi uvicorn pydantic httpx numpy scipy psutil peft python-multipart
          python -m pip install pytest pytest-cov pytest-asyncio pytest-xdist

      - name: Run core-py tests
        run: |
          cd packages/core-py
          python -m pytest tests/ \
            --ignore=tests/test_server_integration.py \
            --ignore=tests/test_process_isolation.py \
            --ignore=tests/test_numpy_engine.py \
            --ignore=tests/test_safetensors_loader.py \
            --ignore=tests/test_morph_tokenizer.py \
            --ignore=tests/test_point_library.py \
            --ignore=tests/test_slonet_compute_sensitivity.py \
            --ignore=tests/test_slonet_provider.py \
            --ignore=tests/test_shell_repl.py \
            -q --tb=short

  # ─── Server API tests ───────────────────────────────────────────
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers fastapi uvicorn pydantic httpx numpy scipy psutil peft python-multipart
          python -m pip install -e packages/mogdb
          python -m pip install pytest pytest-asyncio

      - name: Run server tests
        working-directory: apps/api/server
        run: python -m pytest tests/ -q --tb=short

  # ─── Root-level Python tests (tests/) ───────────────────────────
  # DISABLED: ~100 pre-existing failures from success_response wrapper changes
  # and dead domains.ml_infrastructure imports. Re-enable after cleaning up tests/.
  # test-root:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}
  #         cache: pip
  #         cache-dependency-path: apps/api/server/requirements.txt
  #
  #     - name: Install dependencies
  #       run: |
  #         python -m pip install --upgrade pip
  #         python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
  #         python -m pip install transformers fastapi uvicorn pydantic httpx numpy scipy psutil peft python-multipart
  #         python -m pip install pytest pytest-asyncio pytest-cov requests pytest-xdist
  #
  #     - name: Run root tests
  #       run: |
  #         cd /home/runner/work/sloughGPT/sloughGPT
  #         python -m pytest tests/ \
  #           --override-ini="testpaths=tests" \
  #           --override-ini="addopts=" \
  #           --ignore=tests/test_checkpoint_utils.py \
  #           --ignore=tests/test_knowledge_graph.py \
  #           --ignore=tests/test_lm_eval_char.py \
  #           --ignore=tests/test_rag.py \
  #           --ignore=tests/server/ \
  #           -q --tb=short

  # ─── Frontend: strui (typecheck + test) ─────────────────────────
  test-strui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/strui/package-lock.json
      - name: Install + typecheck + test
        working-directory: packages/strui
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

  # ─── Frontend: web (lint + typecheck + test + build) ────────────
  test-web:
    runs-on: ubuntu-latest
    needs: [test-strui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/strui/package-lock.json

      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: packages/strui
      - name: Ensure @sloughgpt/strui symlink
        run: |
          if [ ! -L node_modules/@sloughgpt/strui ] && [ ! -d node_modules/@sloughgpt/strui ]; then
            mkdir -p node_modules/@sloughgpt
            ln -sfn ../../../../packages/strui node_modules/@sloughgpt/strui
          fi
        working-directory: apps/web

      - name: Lint
        working-directory: apps/web
        run: npx next lint --max-warnings 0

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/web
        run: npx vitest run

      - name: Build
        working-directory: apps/web
        run: npx next build

  # ─── Python SDK tests ──────────────────────────────────────────
  test-sdk-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install + test
        run: |
          python -m pip install --upgrade pip requests httpx pytest pytest-asyncio
          cd packages/sdk-py/sloughgpt_sdk
          python -m pytest ../../../tests/test_sdk.py -v --tb=short

  # ─── Docker build ───────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [lint, test-core-py, test-server, test-strui, test-web, test-sdk-py]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest

      - name: Build CLI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.cli
          push: false
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-cli:latest

  # ─── Deploy (release only) ──────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release'
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}
    steps:
      - name: Release build verified
        run: |
          echo "Image build jobs completed for release ${{ github.event.release.tag_name }}."

  # ─── Benchmark (main only) ─────────────────────────────────────
  benchmark:
    runs-on: ubuntu-latest
    needs: [test-core-py]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/server/requirements.txt
      - name: Install + benchmark
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers numpy
          python scripts/tools/performance_test.py --test latency --runs 5 --tokens 20
