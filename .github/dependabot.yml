# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/sdk-ts/typescript-sdk"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/strui"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/packages/core-py"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/apps/api/server"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/apps/gateway"
    schedule:
      interval: "weekly"
