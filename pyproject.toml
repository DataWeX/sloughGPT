[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sloughgpt"
version = "0.3.0"
description = "SloughGPT - Self-hosted LLM infrastructure platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SloughGPT Team", email = "dev@sloughgpt.ai"}
]
keywords = ["llm", "ai", "machine-learning", "pytorch", "transformers", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "starlette>=0.27.0",
    "httpx>=0.25.0",
    "click>=8.1.0",
    "safetensors>=0.4.0",
    "accelerate>=0.25.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "requests>=2.28.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "downcraft>=0.2.0",
    "coloredlogs>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "websocket-client>=1.6.0",
    "jsonschema>=4.0.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
notebook = [
    "jupyter>=1.0.0",
    "nbclient>=0.6.0",
    "nbformat>=5.0.0",
]
gguf = [
    "llama-cpp-python>=0.2.0",
]
mlflow = [
    "mlflow>=2.8.0",
]
wandb = [
    "wandb>=0.16.0",
]
all = [
    "llama-cpp-python>=0.2.0",
    "mlflow>=2.8.0",
    "wandb>=0.16.0",
]
[project.scripts]
sloughgpt = "apps.cli.src.cli:main"

[project.urls]
Homepage = "https://github.com/iamtowbee/sloughGPT"
Documentation = "https://github.com/iamtowbee/sloughGPT#readme"
Repository = "https://github.com/iamtowbee/sloughGPT"

[tool.setuptools]
# Dual-tree consolidation moved `domain` from packages/core-py/domains to the
# repo root (cards 20260924_047..058), but package-dir still mapped the whole
# tree under packages/core-py — discovery found `domain` via the "." root and
# the map pointed it at the deleted packages/core-py/domain, hard-failing
# `python setup.py egg_info` (card 56cf354c). Single source root: package-dir
# and packages.find must agree, and setup.py is a thin shim over this file.
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.package-data]
domain = ["**/*.sou", "**/*.json", "**/*.yaml", "**/*.txt"]
apps = ["**/*.sou", "**/*.json", "**/*.yaml", "**/*.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "utils*", "apps*", "memory*"]
exclude = ["tests*", "*.tests*", "apps.web*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "N802", "N803", "N806", "N812", "N814", "N818", "N999", "E402", "E701", "E702", "E741", "B008", "N801", "N804", "N805", "N807", "N815", "N817", "B007", "B904", "E721", "B023", "B017", "B005", "B018", "B905", "B002", "B039", "E731", "F601", "C408", "C416", "C401", "UP031", "UP042", "E722", "UP007", "UP035"]

# domain.* is first-party by identity, not by filesystem resolution: the
# domain/shell/_internal/{cmds,addons} entries are machine-local symlinks,
# so probe-based classification diverged between environments and CI flagged
# 11 I001s that pass locally (card ca647de2).
[tool.ruff.lint.isort]
known-first-party = ["domain"]

[tool.ruff.lint.flake8-bugbear]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F811"]
"domain/training/*.py" = ["B006", "C408"]
"packages/core-py/tests/*.py" = ["N801", "F811", "B017"]
"**/tests/*.py" = ["F811", "B017"]
"tests/fixtures/__init__.py" = ["F403", "F405"]
"domain/cognitive/_internal/metacognition/__init__.py" = ["F403", "F405"]
"packages/core-py/scripts/*.py" = ["B018"]
"scripts/examples/*.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["packages/core-py", "domain"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
fail_under = 50
show_missing = true
