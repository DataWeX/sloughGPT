<!doctype html>
<html>
  <head><meta charset="utf-8"><title>v86 bare boot test</title></head>
  <body>
    <!-- Canonical v86 container: text div (pre) + hidden textarea; v86 adds canvas itself -->
    <div id="screen_container" style="background:#000;color:#0f0;font:14px monospace">
      <div style="white-space:pre; font:14px monospace; line-height:14px"></div>
      <textarea style="display:none"></textarea>
    </div>
    <script src="/v86-test/libv86.js"></script>
    <script>
      // Mirror of apps/web/lib/v86-controller.ts ensureV86RenderScheduling:
      // browsers suspend requestAnimationFrame in hidden documents, and v86's
      // screen adapter repaints only from rAF — without this fallback the
      // adapter's buffer never reaches the DOM while the tab is backgrounded.
      (() => {
        if (window.__v86RafShim) return
        window.__v86RafShim = true
        const nativeRaf = window.requestAnimationFrame.bind(window)
        const nativeCancel = window.cancelAnimationFrame.bind(window)
        const timeoutByHandle = new Map()
        const nativeByHandle = new Map()
        let nextHandle = 1
        const viaNative = (handle, cb) =>
          nativeRaf((t) => { nativeByHandle.delete(handle); cb(t) })
        window.requestAnimationFrame = (cb) => {
          const handle = nextHandle++
          if (document.hidden) {
            timeoutByHandle.set(handle, setTimeout(() => {
              timeoutByHandle.delete(handle)
              if (document.hidden) cb(performance.now())
              else nativeByHandle.set(handle, viaNative(handle, cb))
            }, 16))
          } else {
            nativeByHandle.set(handle, viaNative(handle, cb))
          }
          return handle
        }
        window.cancelAnimationFrame = (handle) => {
          const t = timeoutByHandle.get(handle)
          if (t !== undefined) { clearTimeout(t); timeoutByHandle.delete(handle); return }
          const n = nativeByHandle.get(handle)
          if (n !== undefined) { nativeCancel(n); nativeByHandle.delete(handle) }
        }
      })()
      // ?state=<url>&mem=<MB> boots by restoring a v86 saved state instead of
      // the kernel path (GUI-image experiments: states may embed the disk).
      const q = new URLSearchParams(location.search)
      const stateUrl = q.get('state')
      const memMb = parseInt(q.get('mem') || '128', 10)
      const hdaMb = parseInt(q.get('hda') || '0', 10)
      const chunkBytes = parseInt(q.get('chunk') || '262144', 10)
      const netType = q.get('net') || 'ne2k'
      const log = (m) => { document.title = 'v86-test: ' + m; console.log('[test]', m) }
      const events = { putChar: 0, textChange: 0, setSize: 0, serialBytes: 0 }
      window.__events = events
      window.__serial = ''
      log('starting')
      try {
        const base = {
          wasm_path: '/v86-test/v86.wasm',
          vga_memory_size: 8 * 1024 * 1024,
          screen_container: document.getElementById('screen_container'),
          bios: { url: '/bios/seabios.bin' },
          vga_bios: { url: '/bios/vgabios.bin' },
          autostart: true,
          fastboot: true,
          disable_jit: true,
          disable_speaker: true,
        }
        const cfg = stateUrl
          ? {
              ...base,
              memory_size: memMb * 1024 * 1024,
              // States were saved from machines with an IDE primary disk:
              // (1) the PIIX3 ide pci_bars[0..1] only exist when hda is
              //     configured, else Ic.set_state throws "original_bar";
              // (2) the saved drive buffer is a ya (async on-demand file
              //     device, block_cache state shape) — {buffer} builds a z
              //     instead and z.set_state throws on the ya-shaped entry.
              // {url,size,async:true} -> Ca() -> ya with NO upfront download.
              // ya.get_state keeps only WRITTEN sectors, so reads miss the
              // cache and Range-fetch this url — /gui/disks/ is 404 until the
              // image is vendored (download-error events measure the miss rate).
              ...(hdaMb > 0
                ? {
                    hda: {
                      url: '/gui/disks/' + (stateUrl.match(/([^/]+)_state/) || [, 'disk'])[1] + '.img',
                      size: hdaMb * 1024 * 1024,
                      async: true,
                      fixed_chunk_size: chunkBytes,
                    },
                  }
                : {}),
              // NIC class must match the save-time machine: default ne2k
              // serializes at S.set_state a[59] — states saved with
              // net_device.type "virtio" (copy.sh profile bc:"virtio") have
              // a[59]=null there and a virtio_net entry elsewhere; a class
              // mismatch throws ("null[0]") or cross-writes PCI config space.
              net_device: { type: netType },
              initial_state: { url: stateUrl },
              autostart: false,
            }
          : {
              ...base,
              memory_size: 256 * 1024 * 1024,
              bzimage: { url: '/buildroot/bzimage68.bin' },
              cmdline: 'earlyprintk=serial,ttyS0,115200 tsc=reliable mitigations=off random.trust_cpu=on',
            }
        const emulator = new V86(cfg)
        emulator.add_listener('emulator-started', () => { if (!stateUrl) log('started') })
        emulator.add_listener('download-error', (e) => log('download-error ' + e.file_name))
        if (stateUrl) {
          // State mode: continue_init kicks off restore_state() WITHOUT
          // awaiting it (the public wrapper drops the inner promise too) and
          // the restore's internal stop leaves the CPU dead afterwards — the
          // desktop paints as a frozen still (running:false, tick:0). On
          // 'emulator-loaded' the file is fetched; poll-run until the machine
          // takes off and stays off (an early run() may be clobbered by a
          // still-in-flight restore — the next attempt sticks).
          emulator.add_listener('emulator-loaded', () => {
            let tries = 0
            const attempt = () => {
              tries++
              const tick = () => (emulator.v86 && emulator.v86.tick_counter) || 0
              const before = tick()
              emulator.run().catch(() => {})
              setTimeout(() => {
                if (emulator.is_running() && tick() > before) log('started (state restored)')
                else if (tries < 20) attempt()
                else log('restore-error: machine would not start')
              }, 700)
            }
            attempt()
          })
        }
        window.__snap = () => {
          const c = document.getElementById('screen_container').querySelector('canvas')
          return c ? c.toDataURL('image/png') : 'no-canvas'
        }
        const wire = (bus) => {
          if (!bus || typeof bus.register !== 'function') return false
          try {
            bus.register('screen-put-char', () => { events.putChar++ })
            bus.register('screen-text-change', () => { events.textChange++ })
            bus.register('screen-set-size', () => { events.setSize++ })
            bus.register('screen-set-size-graphical', (w, h) => {
              events.setSize++
              events.graphical = w + 'x' + h
            })
            bus.register('serial0-output-byte', (b) => {
              events.serialBytes++
              if (window.__serial.length < 4000) window.__serial += String.fromCharCode(b & 0xff)
            })
            return true
          } catch (err) { return false }
        }
        window.__busWired = !!(wire(emulator.bus) || wire(emulator.emulator_bus))
        window.__emu = emulator
      } catch (e) {
        log('THREW: ' + e)
      }
    </script>
  </body>
</html>
