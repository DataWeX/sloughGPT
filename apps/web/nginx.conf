server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API proxy for development
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Legacy-path redirects — mirrors apps/web/lib/redirects.ts (39 exact paths).
    # Exact locations win over `location /`, so SPA try_files still works for real routes.
    location = /companion   { return 307 /souls; }
    location = /evaluate    { return 307 /benchmark; }
    location = /compare     { return 307 /benchmark; }
    location = /lora-eval   { return 307 /benchmark; }
    location = /experiments { return 307 /benchmark; }
    location = /token-tree  { return 307 /tokenizer; }
    location = /meta-weights { return 307 /models; }
    location = /infer       { return 307 /models; }
    location = /world       { return 307 /models; }
    location = /registry    { return 307 /models; }
    location = /multimodal  { return 307 /models; }
    location = /memory      { return 307 /knowledge; }
    location = /kb          { return 307 /knowledge; }
    location = /docstore    { return 307 /knowledge; }
    location = /collections { return 307 /datasets; }
    location = /self-train  { return 307 /training; }
    location = /learn       { return 307 /training; }
    location = /auto-train  { return 307 /training; }
    location = /rate-limit  { return 307 /monitoring; }
    location = /admin       { return 307 /settings; }
    location = /auth        { return 307 /settings; }
    location = /export      { return 307 /settings; }
    location = /errors      { return 307 /monitoring; }
    location = /security    { return 307 /monitoring; }
    location = /images      { return 307 /developer; }
    location = /session     { return 307 /chat; }
    location = /files       { return 307 /developer; }
    location = /voice       { return 307 /chat?mode=talk; }
    location = /writing     { return 307 /chat?mode=write; }
    location = /rewrite     { return 307 /chat?mode=rewrite; }
    location = /translate   { return 307 /chat?mode=translate; }
    location = /brainstorm  { return 307 /chat?mode=brainstorm; }
    location = /decide      { return 307 /chat?mode=decide; }
    location = /explain     { return 307 /chat?mode=explain; }
    location = /wellness    { return 307 /chat?mode=wellness; }
    location = /shell       { return 307 /developer; }
    location = /vm          { return 307 /developer; }
    location = /workflow    { return 307 /feedback; }
    location = /tools       { return 307 /chat; }
}
