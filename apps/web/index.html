    <!-- Theme bootstrap (lib/document-meta + theme-storage) -->
    <script>
      !(function () {
        try {
          var k = ["purple", "blue", "pink", "green", "orange", "red", "yellow", "teal"]
          var p = ["noir-violet", "ocean", "sunrise", "forest", "monochrome"]
          var t = localStorage.getItem("theme")
          var mo = localStorage.getItem("mode")
          var pl = localStorage.getItem("palette")
          var r = document.documentElement
          var th = k.indexOf(t) >= 0 ? t : "purple"
          var mode = "light" === mo || "dark" === mo ? mo : "dark"
          var pa = p.indexOf(pl) >= 0 ? pl : "noir-violet"
          r.classList.remove("light", "dark")
          k.forEach(function (id) {
            r.classList.remove("theme-" + id)
          })
          p.forEach(function (id) {
            r.classList.remove("palette-" + id)
          })
          r.classList.add(mode, "theme-" + th)
          if (pa !== "noir-violet") r.classList.add("palette-" + pa)
        } catch (e) {}
      })()
    </script>
    <style>
      /* Fonts — same files as lib/document-meta / Vite public/fonts */
      @font-face {
        font-family: "Outfit";
        src: url("/fonts/outfit-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/jetbrains-latin.woff2") format("woff2");
        font-weight: 100 800;
        font-display: swap;
      }
      :root {
        --font-rubik: "Outfit", system-ui, sans-serif;
        --font-jetbrains-mono: "JetBrains Mono", ui-monospace, monospace;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
    </style>

  </body>
