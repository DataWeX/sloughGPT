[pytest]
testpaths = packages/core-py/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not slow" --ignore=packages/core-py/tests/test_morph_tokenizer.py --ignore=packages/core-py/tests/test_safetensors_loader.py --ignore=packages/core-py/tests/test_numpy_engine.py --ignore=packages/core-py/tests/test_point_library.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    ignore:urllib3 v2 only supports OpenSSL 1.1.1+:UserWarning
    ignore:Using `httpx` with.*starlette.testclient.* is deprecated:starlette.exceptions.StarletteDeprecationWarning
    ignore:HTTP_422_UNPROCESSABLE_ENTITY is deprecated:starlette.exceptions.StarletteDeprecationWarning
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
