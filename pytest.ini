[pytest]
; ca167dbd: default per-test timeout so hang/fork-deadlock classes fail fast
; instead of stalling whole-suite runs (sweeps already ran with --timeout=120;
; CLI flags still override). signal method works with the asyncio plugin.
timeout = 120
timeout_method = signal
testpaths = packages/core-py/tests tests apps/cli/tests
# The shared env deliberately does not install mogdb (see the _import_mogdb
# docstring in apps/api/server/infrastructure/startup_history.py), so the
# source tree must be on the path — packages/core-py/pytest.ini carries the
# same entry as ../mogdb/src. Without it, tests/server abort at collection
# with ModuleNotFoundError: No module named 'mogdb'.
pythonpath = packages/mogdb/src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not slow" --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    ignore:urllib3 v2 only supports OpenSSL 1.1.1+:UserWarning
    # Match on message only: the warning category path (starlette.exceptions.
    # StarletteDeprecationWarning) is not exported consistently across starlette
    # versions and made pytest hard-fail during config parsing on some versions.
    ignore:Using `httpx` with.*starlette.testclient.* is deprecated
    ignore:HTTP_422_UNPROCESSABLE_ENTITY is deprecated
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
