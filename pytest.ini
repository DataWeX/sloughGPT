[pytest]
testpaths = packages/core-py/tests tests apps/cli/tests
# Mirror packages/core-py/pytest.ini so rootdir flips don't drop these.
# pytest picks ONE configfile = nearest ini to the common ancestor of the
# args. A root-level arg (e.g. tests/...) moves rootdir to the repo root and
# stops the inner ini applying; without this key `mogdb`/`chargectl` fall off
# sys.path and collection aborts on test_feedback_types.py.
pythonpath = packages/core-py packages/mogdb/src packages/downcraft packages/chargectl/src . apps/api/server
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not slow" --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    ignore:urllib3 v2 only supports OpenSSL 1.1.1+:UserWarning
    # Match on message only: the warning category path (starlette.exceptions.
    # StarletteDeprecationWarning) is not exported consistently across starlette
    # versions and made pytest hard-fail during config parsing on some versions.
    ignore:Using `httpx` with.*starlette.testclient.* is deprecated
    ignore:HTTP_422_UNPROCESSABLE_ENTITY is deprecated
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
