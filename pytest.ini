[pytest]
testpaths = tests
# Single test root: every Python test file lives under tests/.
#   tests/core-py/     (was packages/core-py/tests/)
#   tests/cli/         (was apps/cli/tests/)
#   tests/api-server/  (was apps/api/server/tests/, never collected before)
#   tests/...          (pre-existing root-level tests)
# Mirror packages/core-py/pytest.ini so rootdir flips don't drop these.
# pytest picks ONE configfile = nearest ini to the common ancestor of the
# args. A root-level arg (e.g. tests/...) moves rootdir to the repo root and
# stops the inner ini applying; without this key `mogdb`/`chargectl` fall off
# sys.path and collection aborts on test_feedback_types.py.
# `.pytest-libs` holds symlinks to playwright + greenlet + pyee, the three
# packages test_user_journeys.py needs but the conda env lacks (they live only
# in .venv). Link just those three rather than adding .venv/site-packages,
# which would shadow 82 overlapping packages (numpy, fastapi, pandas...) that
# must keep resolving from conda. Safe: all three are absent from conda, so
# nothing is shadowed. Local, gitignored -- see .gitignore.
pythonpath = packages/core-py packages/mogdb/src packages/downcraft packages/chargectl/src . apps/api/server .pytest-libs tests/api-server
#   ^ tests/api-server: its test modules do `from test_support import ...`,
#     a sibling-module import. Under --import-mode=importlib pytest does not
#     put a test file's own directory on sys.path, so without this entry every
#     one of those files dies at import with ModuleNotFoundError: test_support.
#     This was invisible while apps/api/server/tests was outside testpaths.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not slow" --import-mode=importlib --continue-on-collection-errors
# ^ --continue-on-collection-errors: a file that fails to IMPORT (currently
#   tests/test_soul_path.py, held back pending its module) must not abort the
#   whole run. Without it pytest reports "Interrupted: 1 error during
#   collection" and executes ZERO of the ~46k collected tests, so every bare
#   `python -m pytest` in .opencode/agents/*.md was a guaranteed no-op.
#   This does NOT hide the failure: the file still prints as `ERROR`, and the
#   exit code stays non-zero (verified 1, not 0, even when every collected
#   test passes). The other session already passes this flag by hand on its
#   gate runs; this just makes it the default.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    ignore:urllib3 v2 only supports OpenSSL 1.1.1+:UserWarning
    # Match on message only: the warning category path (starlette.exceptions.
    # StarletteDeprecationWarning) is not exported consistently across starlette
    # versions and made pytest hard-fail during config parsing on some versions.
    ignore:Using `httpx` with.*starlette.testclient.* is deprecated
    ignore:HTTP_422_UNPROCESSABLE_ENTITY is deprecated
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
