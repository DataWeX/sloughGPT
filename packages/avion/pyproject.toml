[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avion"
version = "0.1.0"
description = "Avion — web autoclicker/agent: find, click, type, wait, report."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
avion = "avion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
