[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "man-server"
version = "0.1.0"
description = "Minimal HTTP server — zero dependencies, own ASGI-like interface"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["man_server*"]

[tool.setuptools.package-data]
man_server = ["*.py"]
