[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downcraft"
version = "0.2.0"
description = "HTTP/HTTPS downloader with cross-session resume, integrity verification, and HuggingFace support"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["download", "resume", "http", "range", "huggingface", "models"]
authors = [
    {name = "downcraft"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
hf = ["huggingface-hub>=0.16"]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/anomalyco/sloughGPT"
BugTracker = "https://github.com/anomalyco/sloughGPT/issues"

[project.scripts]
downcraft = "downcraft.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["downcraft*"]
