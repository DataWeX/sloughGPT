[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "grib"
version = "0.1.0"
description = "grib — notes + kanban board management"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
grib = "grib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
