[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "planner"
version = "0.1.0"
description = "Planner — notes + kanban board management"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
planner = "planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
