[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aml"
version = "0.1.0"
description = "AML — Automatic Markup Language"
requires-python = ">=3.9"

[project.scripts]
aml = "aml.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
