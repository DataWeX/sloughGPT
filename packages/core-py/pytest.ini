[pytest]
testpaths = tests
pythonpath = . ../mogdb/src ../downcraft ../../.. ../../../../apps/api/server
addopts = -q -m "not slow" --ignore=tests/test_safetensors_loader.py --ignore=tests/test_numpy_engine.py --ignore=tests/test_morph_tokenizer.py --ignore=tests/test_neural_e2e.py --ignore=tests/test_point_library.py --ignore=tests/test_slonet_broadcast.py --ignore=tests/test_slonet_compute_sensitivity.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    slow: tests that take more than a few seconds (skip with -m "not slow")
    integration: tests that require external services or live API
