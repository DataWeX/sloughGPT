[pytest]
testpaths = tests
pythonpath = . ../mogdb/src ../downcraft ../.. ../../apps/api/server
addopts = -q -m "not slow and not browser" --ignore=tests/test_neural_e2e.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    slow: tests that take more than a few seconds (skip with -m "not slow")
    integration: tests that require external services or live API
    browser: needs a real browser (Firefox/Chromium) — deselected by default
    live: needs a running stack (uvicorn + vite)
