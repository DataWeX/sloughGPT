[pytest]
testpaths = ../tests/core-py
# Mirror of ../../pytest.ini — see that file's header for why both exist.
# pytest selects ONE configfile: the nearest ini to the common ancestor of the
# args. A run rooted here therefore uses THIS file, so it has to carry the same
# behaviour as a repo-root run or a rootdir flip silently drops flags. Every
# behavioural key below is mirrored; only paths (relative to packages/core-py)
# and testpaths differ. Keep the two in sync — a drift here is invisible from
# the repo root.
# NOTE: this package's tests moved to the single test root tests/core-py/
# (2026-10-08), so testpaths now reaches out of the package. This ini exists
# so `cd packages/core-py && pytest` still resolves; a repo-root run never
# selects it, because no arg falls under this directory any more.
pythonpath = . ../mogdb/src ../downcraft ../chargectl/src ../.. ../../apps/api/server
# --continue-on-collection-errors: a file that fails to IMPORT must not abort
# the run. Without it pytest prints "Interrupted: 1 error during collection"
# and executes ZERO tests — verified: one probe file that could not import
# prevented 46 otherwise-passing tests from running at all.
# --import-mode=importlib: the default "prepend" mode lets one test file bind
# to another's module name when basenames collide. Collisions dropped to zero
# when the four test roots merged into tests/ (2026-10-08) — kept because
# `pytest tests/ tests/core-py/` style invocations can still overlap, and the
# mode costs nothing.
addopts = -v --tb=short -m "not slow" --import-mode=importlib --continue-on-collection-errors --ignore=../tests/core-py/test_neural_e2e.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    ignore:urllib3 v2 only supports OpenSSL 1.1.1+:UserWarning
    # Match on message only: the warning category path (starlette.exceptions.
    # StarletteDeprecationWarning) is not exported consistently across starlette
    # versions and made pytest hard-fail during config parsing on some versions.
    ignore:Using `httpx` with.*starlette.testclient.* is deprecated
    ignore:HTTP_422_UNPROCESSABLE_ENTITY is deprecated
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
