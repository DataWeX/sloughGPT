# Dait Shell Configuration
# /opt/sloughgpt/etc/dait.conf

[general]
version = 0.1.0
log_level = INFO
log_file = /var/log/sloughgpt/dait.log

[shell]
prompt = "\u@sloughgpt:\w$ "
history_size = 1000
auto_complete = true
syntax_highlight = true

[kernel]
scheduler = priority
max_processes = 64
memory_limit = 128M

[vm]
enabled = true
memory = 64K
syscall_table = /opt/sloughgpt/etc/syscalls.json

[devices]
llm = /dev/llm
embedding = /dev/embedding
training = /dev/training

[vfs]
mount_points = /dev,/proc,/tmp

[network]
enabled = true
api_port = 8080
web_port = 3000

[training]
enabled = true
checkpoint_dir = /var/lib/sloughgpt/checkpoints
max_jobs = 4
